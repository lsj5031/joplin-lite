<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>joplin-lite — QA mission control</title>
<style>
  :root{
    --paper:#f7f5f0; --paper-2:#efede6; --paper-3:#fffdf9;
    --ink:#253344; --ink-soft:#5f6975; --line:#e3e0d8; --line-strong:#c6c7c3;
    --navy:#16283c; --navy-2:#0f1d2d; --navy-line:#33455c; --navy-text:#a8b4c4;
    --route:#294d78; --route-soft:#9cc1e8; --violet:#294d78;
    --moss:#276b43; --moss-bright:#3e9b63; --signal:#c8322b; --signal-bright:#e05a52;
    --amber:#8a5a12; --amber-bright:#c9821b;
    --r:10px; --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px}
  body{height:100dvh;overflow:hidden}
  .app{display:flex;flex-direction:column;height:100dvh}
  header.top{display:flex;align-items:center;gap:18px;padding:14px 22px;background:var(--navy);color:#fff}
  .mark{width:34px;height:34px;border-radius:9px;background:#fffdf9;color:var(--navy);display:grid;place-items:center;font-weight:800;letter-spacing:-.06em;font-size:15px;flex:none}
  .brand{display:flex;align-items:baseline;gap:10px;flex:none}
  .brand b{font-size:16px;letter-spacing:-.01em}
  .brand span{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--navy-text)}
  .live{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--navy-text);margin-left:auto;flex:none}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--moss-bright);box-shadow:0 0 0 0 rgba(62,155,99,.5);animation:pulse 2.4s infinite}
  .dot.stale{background:var(--amber-bright);animation:none}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(62,155,99,.45)}70%{box-shadow:0 0 0 7px rgba(62,155,99,0)}100%{box-shadow:0 0 0 0 rgba(62,155,99,0)}}
  .clock{font-family:var(--mono);font-size:11px;color:var(--navy-text);font-variant-numeric:tabular-nums}
  .phase{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--navy);background:var(--route-soft);padding:5px 9px;border-radius:999px;font-weight:700;flex:none}

  main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:0}
  .left{min-width:0;overflow:auto;padding:18px 22px 26px}
  .right{border-left:1px solid var(--line);background:var(--paper-2);overflow:auto;padding:18px 16px 26px}

  .kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:14px}
  .kpi{background:var(--paper-3);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px}
  .kpi .n{font-size:25px;font-weight:750;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
  .kpi .l{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin-top:6px;font-weight:650}
  .kpi.pass .n{color:var(--moss)} .kpi.fail .n{color:var(--signal)} .kpi.fixed .n{color:var(--violet)}
  .kpi.blocked .n{color:var(--amber)} .kpi.gap .n{color:var(--amber)} .kpi.untested .n{color:var(--ink-soft)}

  .bar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--paper-2);border:1px solid var(--line);margin-bottom:16px}
  .bar i{display:block;height:100%}
  .bar .s-pass{background:var(--moss-bright)} .bar .s-fixed{background:#6f8fb5}
  .bar .s-blocked{background:var(--amber-bright)} .bar .s-gap{background:#c9a15a}
  .bar .s-fail{background:var(--signal)} .bar .s-untested{background:#ddd8cd}

  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
  .tabs{display:flex;gap:4px;background:var(--paper-2);padding:3px;border-radius:9px;border:1px solid var(--line)}
  .tabs button{border:0;background:transparent;font:inherit;font-size:12px;font-weight:600;color:var(--ink-soft);padding:6px 10px;border-radius:7px;cursor:pointer;white-space:nowrap}
  .tabs button[aria-pressed="true"]{background:var(--paper-3);color:var(--ink);box-shadow:0 1px 2px rgba(22,40,60,.09)}
  .tabs button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--route);outline-offset:1px}
  select,input[type=search]{font:inherit;font-size:12px;border:1px solid var(--line-strong);background:var(--paper-3);border-radius:8px;padding:7px 9px;color:var(--ink)}
  input[type=search]{min-width:210px}

  .areas{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
  .area{background:var(--paper-3);border:1px solid var(--line);border-radius:var(--r);padding:9px 11px}
  .area .top{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;font-weight:650}
  .area .top span{color:var(--ink-soft);font-family:var(--mono);font-weight:500;font-size:10.5px}
  .area .meter{height:5px;border-radius:999px;background:var(--paper-2);overflow:hidden;margin-top:7px;display:flex}
  .area .meter i{display:block;height:100%}

  .board{background:var(--paper-3);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  table{width:100%;border-collapse:collapse}
  thead th{position:sticky;top:0;background:var(--paper-3);z-index:1;text-align:left;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);font-weight:700;padding:9px 12px;border-bottom:1px solid var(--line)}
  tbody tr{border-bottom:1px solid var(--line);cursor:pointer}
  tbody tr:hover{background:#fbfaf6}
  tbody tr.sel{background:#eef3f9}
  tbody td{padding:9px 12px;vertical-align:top;font-size:12.5px}
  tbody td.id{font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);white-space:nowrap;width:74px}
  tbody td.feat{font-weight:600;line-height:1.35}
  tbody td.feat small{display:block;font-weight:400;color:var(--ink-soft);margin-top:2px;font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:52ch}
  tbody td.ev{font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 8px;font-size:10px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;border:1px solid transparent;white-space:nowrap}
  .pill.pass{background:#e7f1e9;color:var(--moss);border-color:#c9dfcf}
  .pill.fail{background:#fbeae8;color:var(--signal);border-color:#f2cdc9}
  .pill.fixed{background:#e8eef6;color:var(--route);border-color:#cfdcea}
  .pill.blocked{background:#fbf0dc;color:var(--amber);border-color:#eeddbb}
  .pill.gap{background:#f6eedb;color:#7a5a19;border-color:#e9dcc0}
  .pill.untested{background:#f1efe9;color:var(--ink-soft);border-color:#e3e0d8}
  .sev{font-family:var(--mono);font-size:10px;color:var(--signal);font-weight:700}

  .right h2{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 9px}
  .right section{margin-bottom:20px}
  .blockers{display:flex;flex-direction:column;gap:7px}
  .blocker{background:var(--paper-3);border:1px solid var(--line);border-left:3px solid var(--signal);border-radius:7px;padding:8px 9px;cursor:pointer}
  .blocker.gap{border-left-color:var(--amber-bright)}
  .blocker.blocked{border-left-color:var(--amber-bright)}
  .blocker b{display:block;font-size:10.5px;font-family:var(--mono);color:var(--ink-soft);margin-bottom:3px}
  .blocker span{font-size:11.5px;line-height:1.4;display:block;color:var(--ink)}
  .blocker em{display:block;font-style:normal;color:var(--signal);font-size:11px;margin-top:4px;line-height:1.35}
  .feed{display:flex;flex-direction:column;gap:0}
  .ev{display:grid;grid-template-columns:44px 1fr;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:11.5px;line-height:1.4}
  .ev time{font-family:var(--mono);font-size:9.5px;color:var(--ink-soft);padding-top:2px}
  .ev .msg{color:var(--ink)}
  .ev .msg b{font-family:var(--mono);font-size:10px;font-weight:600;color:var(--route);margin-right:4px}
  .empty{font-size:11.5px;color:var(--ink-soft);padding:8px 0}
  .legend{display:flex;flex-wrap:wrap;gap:9px;font-size:10.5px;color:var(--ink-soft);margin-top:8px}
  .legend i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:4px}

  dialog{border:1px solid var(--line-strong);border-radius:14px;padding:0;width:min(680px,calc(100vw - 32px));max-height:86dvh;background:var(--paper-3);color:var(--ink);box-shadow:0 24px 80px rgba(15,29,45,.28)}
  dialog::backdrop{background:rgba(15,29,45,.42)}
  .dlg{padding:18px 20px 20px}
  .dlg header{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
  .dlg h3{margin:0;font-size:17px;letter-spacing:-.01em;line-height:1.3}
  .dlg .sub{font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);margin-top:4px}
  .dlg .close{margin-left:auto;border:1px solid var(--line-strong);background:var(--paper);border-radius:7px;min-height:34px;padding:0 10px;font:inherit;font-size:12px;cursor:pointer}
  .dlg dl{display:grid;grid-template-columns:96px 1fr;gap:8px 12px;margin:12px 0 0;font-size:12.5px;line-height:1.5}
  .dlg dt{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);font-weight:700;padding-top:3px}
  .dlg dd{margin:0}
  .dlg .err{color:var(--signal)} .dlg .fix{color:var(--moss)}
  @media (max-width:1180px){main{grid-template-columns:1fr}.right{display:none}.kpis{grid-template-columns:repeat(3,1fr)}.areas{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="mark">jl</div>
    <div class="brand"><b>joplin-lite</b><span>QA mission control</span></div>
    <span class="phase" id="phase">booting</span>
    <div class="live"><span class="dot" id="dot"></span><span id="livetext">live</span><span class="clock" id="clock">--:--:--</span></div>
  </header>

  <main>
    <div class="left">
      <div class="kpis" id="kpis"></div>
      <div class="bar" id="bar" role="img" aria-label="Overall status distribution"></div>
      <div class="areas" id="areas"></div>

      <div class="toolbar">
        <div class="tabs" id="tabs" role="group" aria-label="Filter by status"></div>
        <select id="area" aria-label="Filter by area"><option value="">All areas</option></select>
        <input id="q" type="search" placeholder="Search stories, IDs, errors…" aria-label="Search stories" />
      </div>

      <div class="board">
        <table>
          <thead><tr><th>ID</th><th>User story</th><th>Status</th><th>Evidence</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="legend">
        <span><i style="background:var(--moss-bright)"></i>pass</span>
        <span><i style="background:#6f8fb5"></i>fixed (awaiting retest)</span>
        <span><i style="background:var(--signal)"></i>fail</span>
        <span><i style="background:var(--amber-bright)"></i>blocked / needs real target</span>
        <span><i style="background:#c9a15a"></i>gap</span>
        <span><i style="background:#ddd8cd"></i>untested</span>
      </div>
    </div>

    <aside class="right">
      <section>
        <h2>Open blockers</h2>
        <div class="blockers" id="blockers"></div>
      </section>
      <section>
        <h2>Live activity</h2>
        <div class="feed" id="feed"></div>
      </section>
    </aside>
  </main>
</div>

<dialog id="detail" aria-labelledby="dt"><div class="dlg">
  <header><div><h3 id="dt"></h3><div class="sub" id="dsub"></div></div><button class="close" id="dclose" autofocus>Close</button></header>
  <dl id="dbody"></dl>
</div></dialog>

<script>
const $ = s => document.querySelector(s)
const els = {kpis:$('#kpis'), bar:$('#bar'), areas:$('#areas'), rows:$('#rows'), tabs:$('#tabs'),
  area:$('#area'), q:$('#q'), blockers:$('#blockers'), feed:$('#feed'), phase:$('#phase'),
  clock:$('#clock'), dot:$('#dot'), livetext:$('#livetext'), dlg:$('#detail'), dt:$('#dt'), dsub:$('#dsub'), dbody:$('#dbody')}
let rows = [], lastSig = '', filter = 'all', selected = ''
const label = {pass:'pass', fail:'fail', fixed:'fixed', blocked:'blocked', gap:'gap', untested:'untested'}

function parseCSV(text){
  const out=[]; let row=[], field='', quoted=false
  for(let i=0;i<text.length;i++){
    const c=text[i]
    if(quoted){
      if(c==='"'){ if(text[i+1]==='"'){field+='"';i++} else quoted=false }
      else field+=c
    } else if(c==='"') quoted=true
    else if(c===','){ row.push(field); field='' }
    else if(c==='\n'){ row.push(field); out.push(row); row=[]; field='' }
    else if(c!=='\r') field+=c
  }
  if(field!==''||row.length){row.push(field);out.push(row)}
  const head=out.shift()||[]
  return out.filter(r=>r.length>1).map(r=>Object.fromEntries(head.map((h,i)=>[h,r[i]??''])))
}
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
const counts = list => list.reduce((a,r)=>(a[r.status]=(a[r.status]||0)+1,a),{})

function renderKpis(c,total){
  const order=[['pass','Passing'],['fail','Failing'],['fixed','Fixed · retest'],['blocked','Blocked'],['gap','Gaps'],['untested','Untested']]
  els.kpis.innerHTML = order.map(([k,l])=>`<div class="kpi ${k}"><div class="n">${c[k]||0}</div><div class="l">${l}</div></div>`).join('')
  const pct = n => total ? (100*n/total).toFixed(2)+'%' : '0%'
  els.bar.innerHTML = ['pass','fixed','blocked','gap','fail','untested'].map(k=>`<i class="s-${k}" style="width:${pct(c[k]||0)}" title="${k}: ${c[k]||0}"></i>`).join('')
}

function renderAreas(){
  const by = {}
  for(const r of rows){ (by[r.area] ||= []).push(r) }
  els.areas.innerHTML = Object.entries(by).map(([area,list])=>{
    const c=counts(list), n=list.length
    const seg = ['pass','fixed','fail','blocked','gap','untested'].map(k=>{
      const w = n?100*(c[k]||0)/n:0; return w?`<i class="s-${k}" style="width:${w}%"></i>`:'' }).join('')
    const done=(c.pass||0)+(c.fixed||0)
    return `<div class="area"><div class="top"><b>${esc(area)}</b><span>${done}/${n}</span></div><div class="meter">${seg}</div></div>`
  }).join('')
}

function visible(){
  const q=els.q.value.trim().toLowerCase(), area=els.area.value
  return rows.filter(r=>{
    if(area && r.area!==area) return false
    if(filter==='failing' && !['fail','gap','blocked'].includes(r.status)) return false
    if(filter==='fixed' && r.status!=='fixed') return false
    if(filter==='passing' && r.status!=='pass') return false
    if(filter==='untested' && r.status!=='untested') return false
    if(q){ const hay=(r.id+' '+r.area+' '+r.feature+' '+r.user_story+' '+r.expected+' '+r.error+' '+r.evidence).toLowerCase(); if(!hay.includes(q)) return false }
    return true
  })
}

function renderTable(){
  const list=visible()
  els.rows.innerHTML = list.map(r=>`
    <tr data-id="${r.id}" class="${selected===r.id?'sel':''}" tabindex="0">
      <td class="id">${esc(r.id)}</td>
      <td class="feat">${esc(r.feature)}<small>${esc(r.user_story)}</small></td>
      <td><span class="pill ${r.status}">${label[r.status]||esc(r.status)}</span>${r.severity&&r.severity!=='-'?` <span class="sev">${esc(r.severity)}</span>`:''}</td>
      <td class="ev" title="${esc(r.evidence)}">${esc(r.evidence)||'—'}</td>
    </tr>`).join('') || `<tr><td colspan="4" class="empty">Nothing matches this filter.</td></tr>`
}

function renderBlockers(){
  const open = rows.filter(r=>['fail','gap','blocked'].includes(r.status))
  const rank={fail:0,gap:1,blocked:2}
  open.sort((a,b)=>rank[a.status]-rank[b.status]||a.id.localeCompare(b.id))
  els.blockers.innerHTML = open.slice(0,10).map(r=>`
    <div class="blocker ${r.status}" data-id="${r.id}">
      <b>${esc(r.id)} · ${esc(r.status)}</b>
      <span>${esc(r.feature)}</span>
      <em>${esc(r.error || r.expected)}</em>
    </div>`).join('') || '<div class="empty">No open blockers. Every story that can run is green.</div>'
}

async function renderFeed(){
  try{
    const res=await fetch('activity.jsonl?t='+Date.now())
    if(!res.ok) throw 0
    const text=await res.text()
    const ev=text.trim().split('\n').filter(Boolean).slice(-28).reverse()
      .map(l=>{try{return JSON.parse(l)}catch{return null}}).filter(Boolean)
    els.feed.innerHTML = ev.map(e=>{
      const t=e.at?new Date(e.at).toLocaleTimeString('en-GB',{hour12:false}):''
      return `<div class="ev"><time>${esc(t)}</time><div class="msg">${e.id?`<b>${esc(e.id)}</b>`:''}${esc(e.message||e.status||'')}</div></div>`
    }).join('') || '<div class="empty">No activity yet.</div>'
  }catch{ els.feed.innerHTML='<div class="empty">Activity feed unavailable.</div>' }
}

function phaseOf(c){
  if((c.untested||0)>0) return 'testing'
  if((c.fail||0)>0) return 'fixing'
  if((c.fixed||0)>0) return 'retesting'
  return 'showcase'
}

function openDetail(id){
  const r=rows.find(x=>x.id===id); if(!r) return
  selected=id; renderTable()
  els.dt.textContent=r.feature
  els.dsub.textContent=`${r.id} · ${r.area} · ${r.status}`
  const rowsD=[['User story',r.user_story],['Expected',r.expected],['Evidence',r.evidence||'—'],
    ...(r.error?[['Error',r.error,'err']]:[]), ...(r.fix?[['Fix',r.fix,'fix']]:[]), ...(r.notes?[['Notes',r.notes]]:[])]
  els.dbody.innerHTML=rowsD.map(([k,v,cls])=>`<dt>${esc(k)}</dt><dd class="${cls||''}">${esc(v)}</dd>`).join('')
  if(!els.dlg.open) els.dlg.showModal()
}
els.dlg.addEventListener('click', e=>{ if(e.target===els.dlg) els.dlg.close() })
$('#dclose').addEventListener('click',()=>els.dlg.close())
els.dlg.addEventListener('close',()=>{selected='';renderTable()})

async function tick(){
  try{
    const res=await fetch('features.csv?t='+Date.now(),{cache:'no-store'})
    if(!res.ok) throw new Error('features.csv → '+res.status)
    const text=await res.text()
    const parsed=parseCSV(text)
    const sig=text.length+':'+parsed.length+':'+parsed.reduce((a,r)=>a+r.status,0)
    if(sig!==lastSig){
      lastSig=sig; rows=parsed
      const c=counts(rows), n=rows.length
      renderKpis(c,n); renderAreas(); renderTable(); renderBlockers()
      els.phase.textContent=phaseOf(c)
      if(!els.area.options.length || els.area.options.length-1!==new Set(rows.map(r=>r.area)).size){
        const cur=els.area.value
        els.area.innerHTML='<option value="">All areas</option>'+[...new Set(rows.map(r=>r.area))].map(a=>`<option>${esc(a)}</option>`).join('')
        els.area.value=cur
      }
      renderFeed()
    }
    els.dot.classList.remove('stale'); els.livetext.textContent='live'
    els.clock.textContent=new Date().toLocaleTimeString('en-GB',{hour12:false})
  }catch(e){
    els.dot.classList.add('stale'); els.livetext.textContent='reconnecting…'
  }
}

const filters=[['all','All'],['failing','Open'],['fixed','Fixed'],['passing','Pass'],['untested','Untested']]
els.tabs.innerHTML=filters.map(([k,l])=>`<button type="button" data-f="${k}" aria-pressed="${k==='all'}">${l}</button>`).join('')
els.tabs.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return
  filter=b.dataset.f
  for(const x of els.tabs.querySelectorAll('button')) x.setAttribute('aria-pressed', String(x===b))
  renderTable()
})
els.area.addEventListener('change',renderTable)
els.q.addEventListener('input',renderTable)
els.rows.addEventListener('click',e=>{const tr=e.target.closest('tr[data-id]'); if(tr) openDetail(tr.dataset.id)})
els.rows.addEventListener('keydown',e=>{if(e.key==='Enter'){const tr=e.target.closest('tr[data-id]'); if(tr) openDetail(tr.dataset.id)}})
els.blockers.addEventListener('click',e=>{const b=e.target.closest('[data-id]'); if(b) openDetail(b.dataset.id)})

tick(); setInterval(tick, 2000)
</script>
</body>
</html>
